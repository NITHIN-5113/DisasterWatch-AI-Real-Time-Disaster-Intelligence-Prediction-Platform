<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DisasterWatch - Operations Command Center</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
</head>
<body>
  <script>
    window.API_BASE_URL = window.API_BASE_URL || 'http://localhost:4000/api/v1';
    (function enforceAuth() {
      try {
        const u = localStorage.getItem('dw_user');
        const t = localStorage.getItem('dw_token');
        if (!u || !t) {
          window.location.replace('login.html');
        }
      } catch (_) {}
    })();
  </script>

  <!-- Full-Screen App Container -->
  <div class="dw-app-container">
    <!-- Map Viewport -->
    <div id="mapRoot"></div>

    <!-- Floating Slim Left Layer Panel -->
    <div id="layerPanelRoot"></div>

    <!-- Floating Right-Hand Controls Stack -->
    <div id="controlsRoot"></div>

    <!-- Floating Slide-Over Threat Detail Panel -->
    <div id="eventDetailRoot" class="hidden"></div>

    <!-- Floating Bottom Timeline Controls -->
    <div id="timelineRoot"></div>

    <!-- Bottom Telemetry & Attribution Status Bar -->
    <div id="statusBarRoot"></div>

    <!-- Modal Dialogs Container -->
    <div id="modalRoot"></div>

    <!-- Global Toast Alerts -->
    <div class="toast-container" id="toastContainer"></div>
  </div>

  <!-- Scripts -->
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="src/icons.js"></script>
  <script src="src/state.js"></script>
  <script src="src/utils.js"></script>
  <script src="src/components/MapView.js"></script>
  <script src="src/components/LayerPanel.js"></script>
  <script src="src/components/TimelineBar.js"></script>
  <script src="src/components/ControlsBar.js"></script>
  <script src="src/components/EventDetailPanel.js"></script>
  <script src="src/components/StatusBar.js"></script>
  <script src="src/components/SettingsModal.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
